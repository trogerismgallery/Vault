<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TROGERISM | Exhibition</title>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: center; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        header { padding: 50px 20px; border-bottom: 1px solid #222; }
        h1 { color: #fff; letter-spacing: 14px; text-transform: uppercase; margin: 0; font-size: 2.4rem; font-weight: 200; }
        .sub-header { font-size: 0.8rem; letter-spacing: 4px; color: #666; text-transform: uppercase; margin-top: 10px; }
        .btn-style { background:#fff; color:#000; padding:15px 30px; text-decoration:none; font-size:0.6rem; font-weight:bold; letter-spacing:3px; text-transform:uppercase; cursor: pointer; border: none; margin: 10px; display: inline-block; }
        .exhibition-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1400px; margin: 40px auto; padding: 20px; }
        .gallery-item { background: #0c0c0c; border: 1px solid #1a1a1a; padding: 10px; }
        .image-container { position: relative; width: 100%; aspect-ratio: 3/4; background: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .image-container img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .image-container::after { content: "TROGERISM"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.15); font-size: 1.5rem; letter-spacing: 8px; font-weight: bold; pointer-events: none; white-space: nowrap; }
        @media (max-width: 900px) { .exhibition-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .exhibition-container { grid-template-columns: repeat(1, 1fr); } }
    </style>
</head>
<body>

    <header>
        <h1>TROGERISM</h1>
        <div class="sub-header">Tom Rogers | Bognor Regis, West Sussex</div>
    </header>

    <div class="exhibition-container" id="exhibition-grid"></div>

    <script>
        const images = [
            "urban - street - style - photography - notting - hill (1 of 1).jpg",
            "urban - street - strider - photography - croydon (1 of 1).jpg",
            "urban - reflection - candid - street - photography - notting - hill (1 of 1).jpg",
            "urban - quiet - moment - street - documentary - photography - woolwich (1 of 1).jpg",
            "urban - mural - art - street - photography - notting - hill (1 of 1).jpg",
            "urban - market - street - documentary - notting - hill (1 of 1).jpg",
            "urban - market - scene - photography - notting - hill (1 of 1).jpg",
            "urban - lifestyle - photography - notting - hill (1 of 1).jpg",
            "urban - lifestyle - documentary - photography - north - london (2 of 1).jpg",
            "urban - lifestyle - documentary - photography - north - london (1 of 1).jpg",
            "urban - landscape - viewpoint - documentary - photography - woolwich (1 of 1).jpg",
            "Urban - geometric - street - photography - croydon (1 of 1).jpg",
            "urban - documentary - photography - woolwich (1 of 1).jpg",
            "urban - documentary - photography - notting - hill (1 of 1).jpg",
            "urban - crowd - documentary - photoggraphy - notting - hill (1 of 1).jpg",
            "urban - commute - candid - documentary - photography - o2 - arena (1 of 1).jpg",
            "solitary - figure - coastal - pier - bognor - regis (1 of 1).jpg",
            "seaside - documentary - photography - west - wittering (1 of 1).jpg",
            "seaside - documentary - photography - west - wittering (1 of 1)_2.jpg",
            "seaside - architecture - candid - documentary - photography - west - wittering (1 of 1).jpg",
            "relaxing - at - the - beach - documentary - photography - west - wittering (1 of 1).jpg",
            "public - celebration - candid - street - photography - north - london (1 of 1).jpg",
            "parent - and - child - walking - street - documentary - photography - woolwich (1 of 1).jpg",
            "moody - coastal - candid - photography - bognor - regis (1 of 1).jpg",
            "historic - cathedral - architecture - dramatic - sky - photography - chichester (1 of 1).jpg",
            "geometric - composition - coastal - landscape- photography - bognor - regis (1 of 1).jpg",
            "cyclist - in - motion - coastal - path - bognor - regis (1 of 1).jpg",
            "countryside - serenity - documentary - style - photography - west - wittering (1 of 1).jpg",
            "coastal - contemplation - candid - seaside- photography - bognor - regis (1 of 1).jpg",
            "candid - street - scene - photography - north - london (2 of 1).jpg",
            "city - life - and - rooftop - activity - candid - photography - o2 - arena (1 of 1).jpg",
            "candid - street - portrait - documentary - notting - hill (1 of 1).jpg",
            "candid - street - photography - urban - mural - woolwich (1 of 1).jpg",
            "candid - moment - urban - market - documentary - notting - hill (1 of 1).jpg",
            "candid - moment - urban - landscape - woolwich (1 of 1).jpg",
            "candid - moment - urban - design - o2 - arena (1 of 1).jpg",
            "candid - moment - london - souvenir - shop - street - photography - notting - hill (1 of 1).jpg",
            "candid - beach - stroll - coastal - documentary - photography - bognor - regis (1 of 1).jpg",
            "calm - waters -reflected - architecture - photography - chichester (1 of 1).jpg"
        ];

        const gridContainer = document.getElementById('exhibition-grid');
        images.forEach(src => {
            const card = document.createElement('div');
            card.className = 'gallery-item';
            card.innerHTML = `<div class="image-container"><img src="images/${src}" loading="lazy"></div>`;
            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
