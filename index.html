<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TROGERISM PHOTOGRAPHY</title>
    <style>
        .gallery-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .gallery-item img { width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="gallery-container" id="gallery"></div>

    <script>
        const imageFiles = [
            "candid - beach - stroll - coastal - documentary - photography - bognor - regis (1 of 1).jpg",
            "coastal - contemplation - candid - seaside - photography - bognor - regis (1 of 1).jpg",
            "moody - coastal - candid - photography - bognor - regis (1 of 1).jpg"
        ];

        const gallery = document.getElementById('gallery');
        imageFiles.forEach(file => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            // We are explicitly using a direct path here
            div.innerHTML = `<img src="./images/${file}">`;
            gallery.appendChild(div);
        });
    </script>
</body>
</html>
